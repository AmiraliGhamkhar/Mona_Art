name: android

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Every command records its own exit code; the step fails at the end if any
      # command failed. There is no `set +e` and no stashed job-level exit code.
      - name: Verify
        id: verify
        run: |
          set -o pipefail
          STEPS="engine engine_test app_test assemble release lint quality android_test_compile kover"
          echo "STEPS=$STEPS" >> "$GITHUB_ENV"
          run_step() {
            name="$1"
            shift
            if "$@" 2>&1 | tee "/tmp/$name.log"; then
              echo 0 > "/tmp/$name.log.code"
            else
              rc=$?
              echo "$rc" > "/tmp/$name.log.code"
            fi
          }
          run_step engine ./gradlew --no-daemon --console=plain :engine:selfCheck -PmonaReport=/tmp/engine-report.md
          run_step engine_test ./gradlew --no-daemon --console=plain :engine:test
          run_step app_test ./gradlew --no-daemon --console=plain :app:testDebugUnitTest
          run_step assemble ./gradlew --no-daemon --console=plain :app:assembleDebug
          run_step release ./gradlew --no-daemon --console=plain :app:assembleRelease :app:bundleRelease
          run_step lint ./gradlew --no-daemon --console=plain :app:lintDebug
          # Lint's console output only prints the first failure. Every error is
          # in the SARIF report, so dump them into the same log; otherwise a
          # second error is invisible until the first is fixed and CI runs again.
          python3 - >> /tmp/lint.log 2>&1 <<'PY' || true
          import glob, json
          for f in glob.glob('app/build/reports/lint-results-debug.sarif'):
              d = json.load(open(f))
              for run in d.get('runs', []):
                  for res in run.get('results', []):
                      if res.get('level') != 'error':
                          continue
                      loc = res['locations'][0]['physicalLocation']
                      uri = loc['artifactLocation']['uri']
                      line = loc.get('region', {}).get('startLine')
                      print(f"LINT ERROR {res['ruleId']}: {uri}:{line}: {res['message']['text']}")
          PY
          run_step quality ./gradlew --no-daemon --console=plain detekt ktlintCheck
          run_step android_test_compile ./gradlew --no-daemon --console=plain :app:assembleDebugAndroidTest
          run_step kover ./gradlew --no-daemon --console=plain :engine:koverHtmlReport :engine:koverXmlReport
          fail=0
          for name in $STEPS; do
            code=$(cat "/tmp/$name.log.code" 2>/dev/null || echo missing)
            [ "$code" = "0" ] || fail=1
          done
          exit $fail

      # BUILD_REPORT.md is a job summary + artifact, never a self-commit.
      - name: Write report and job summary
        if: always()
        run: |
          echo "verify=${{ steps.verify.outcome }}" > /tmp/step-outcomes.txt
          python3 scripts/make_report.py > /tmp/make-report.log 2>&1 || true
          if [ -f BUILD_REPORT.md ]; then
            cat BUILD_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BUILD_REPORT.md was not generated" >> "$GITHUB_STEP_SUMMARY"
          fi
          sha256sum app/build/outputs/apk/debug/*.apk 2>/dev/null || true

      # Action-runner logs are not readable by every toolchain that has to act on
      # a failure, so a failure also lands in one persistent issue per branch.
      # This is a diagnostic channel, not a status report: it carries the raw
      # Gradle tail of every step that returned non-zero.
      - name: Publish failing step logs to the branch diagnostic issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          TITLE="CI diagnostics: ${REF}"
          {
            echo "### ${SHA}"
            echo
            echo "- run: ${RUN_URL}"
            echo "- ref: \`${REF}\`"
            echo "- when: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "| Step | Exit |"
            echo "|---|---|"
            for name in $STEPS; do
              echo "| $name | $(cat "/tmp/$name.log.code" 2>/dev/null || echo missing) |"
            done
            echo
            for name in $STEPS; do
              code=$(cat "/tmp/$name.log.code" 2>/dev/null || echo missing)
              [ "$code" = "0" ] && continue
              echo "#### $name (exit $code)"
              echo
              echo '```text'
              tail -n 220 "/tmp/$name.log" 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo
            done
          } > /tmp/ci-failure.md
          # Issue bodies are capped at 65536 characters; keep only the head.
          head -c 60000 /tmp/ci-failure.md > /tmp/ci-failure-trim.md
          existing=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file /tmp/ci-failure-trim.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/ci-failure-trim.md
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mona-art-build
          path: |
            BUILD_REPORT.md
            docs/baseline/kover-coverage.txt
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            engine/build/reports/kover/html/**
            **/build/reports/detekt/**
            **/build/reports/ktlint/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
