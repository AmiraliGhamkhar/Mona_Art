name: android

on:
  push:
    branches: [main, arena/102e93bd-mona-art]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Every command records its own exit code; the step fails at the end if any
      # command failed. There is no `set +e` and no stashed job-level exit code.
      - name: Verify
        id: verify
        run: |
          set -o pipefail
          run_step() {
            name="$1"
            shift
            if "$@" 2>&1 | tee "/tmp/$name.log"; then
              echo 0 > "/tmp/$name.log.code"
            else
              rc=$?
              echo "$rc" > "/tmp/$name.log.code"
            fi
          }
          run_step engine ./gradlew --no-daemon --console=plain :engine:selfCheck -PmonaReport=/tmp/engine-report.md
          run_step engine_test ./gradlew --no-daemon --console=plain :engine:test
          run_step app_test ./gradlew --no-daemon --console=plain :app:testDebugUnitTest
          run_step assemble ./gradlew --no-daemon --console=plain :app:assembleDebug
          run_step release ./gradlew --no-daemon --console=plain :app:assembleRelease :app:bundleRelease
          run_step lint ./gradlew --no-daemon --console=plain :app:lintDebug
          run_step quality ./gradlew --no-daemon --console=plain detekt ktlintCheck
          run_step android_test_compile ./gradlew --no-daemon --console=plain :app:assembleDebugAndroidTest
          run_step kover ./gradlew --no-daemon --console=plain :engine:koverHtmlReport :engine:koverXmlReport
          fail=0
          for name in engine engine_test app_test assemble release lint quality android_test_compile kover; do
            code=$(cat "/tmp/$name.log.code")
            [ "$code" = "0" ] || fail=1
          done
          exit $fail

      # BUILD_REPORT.md is now a job summary + artifact, never a self-commit.
      - name: Write report and job summary
        if: always()
        run: |
          echo "verify=${{ steps.verify.outcome }}" > /tmp/step-outcomes.txt
          python3 scripts/make_report.py > /tmp/make-report.log 2>&1 || true
          if [ -f BUILD_REPORT.md ]; then
            cat BUILD_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BUILD_REPORT.md was not generated" >> "$GITHUB_STEP_SUMMARY"
          fi
          sha256sum app/build/outputs/apk/debug/*.apk 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mona-art-build
          path: |
            BUILD_REPORT.md
            docs/baseline/kover-coverage.txt
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            engine/build/reports/kover/html/**
            **/build/reports/detekt/**
            **/build/reports/ktlint/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
