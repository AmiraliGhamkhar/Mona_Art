name: probe
on:
  push:
    branches: [arena/9d3993b8-mona-art]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: versions
        run: |
          set -e
          probe() {
            name="$1"; url="$2"; n="${3:-3}"
            vs=$(curl -s --max-time 25 "$url" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -viE 'alpha|beta|rc|dev|-M[0-9]' | tail -n "$n" | tr '\n' ',')
            echo "\"$name\":\"$vs\""
          }
          G=https://dl.google.com/dl/android/maven2
          C=https://repo1.maven.org/maven2
          {
            probe agp $G/com/android/tools/build/gradle/maven-metadata.xml 4
            probe composeBom $G/androidx/compose/compose-bom/maven-metadata.xml 4
            probe material3 $G/androidx/compose/material3/material3/maven-metadata.xml 3
            probe material3Adaptive $G/androidx/compose/material3/material3-adaptive/maven-metadata.xml 2
            probe coreKtx $G/androidx/core/core-ktx/maven-metadata.xml 3
            probe ink $G/androidx/ink/ink-authoring/maven-metadata.xml 3
            probe inkStroke $G/androidx/ink/ink-strokes/maven-metadata.xml 3
            probe activityCompose $G/androidx/activity/activity-compose/maven-metadata.xml 3
            probe lifecycleVmo $G/androidx/lifecycle/lifecycle-viewmodel-compose/maven-metadata.xml 3
            probe navigationCompose $G/androidx/navigation/navigation-compose/maven-metadata.xml 3
            probe room $G/androidx/room/room-runtime/maven-metadata.xml 3
            probe datastore $G/androidx/datastore/datastore-preferences/maven-metadata.xml 3
            probe composeCompilerPlugin $C/org/jetbrains/kotlin/compose-compiler-gradle-plugin/maven-metadata.xml 2
            probe kotlinGradlePlugin $C/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml 3
            probe coilCompose $C/io/coil-kt/coil-compose/maven-metadata.xml 3
            probe coil3Compose $C/io/coil-kt/coil3/coil-compose/maven-metadata.xml 3
            probe serializationJson $C/org/jetbrains/kotlinx/kotlinx-serialization-json/maven-metadata.xml 3
            probe coroutines $C/org/jetbrains/kotlinx/kotlinx-coroutines-android/maven-metadata.xml 3
            probe junit $C/junit/junit/maven-metadata.xml 2
            probe robolectric $C/org/robolectric/robolectric/maven-metadata.xml 3
            probe espresso $G/androidx/test/espresso/espresso-core/maven-metadata.xml 2
            probe testExtJunit $G/androidx/test/ext/junit/maven-metadata.xml 2
            probe jankstats $G/androidx/metrics/metrics-performance/maven-metadata.xml 2
            probe exifinterface $G/androidx/exifinterface/exifinterface/maven-metadata.xml 2
          } | sed 's/,$//' | awk 'BEGIN{print "{"} {printf "%s%s", (NR>1?",":""), $0} END{print "}"}' > versions.json
          cat versions.json
          echo "::notice title=VERSIONS::$(cat versions.json)"
      - uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions.json
