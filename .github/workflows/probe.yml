name: probe
on:
  push:
    branches: [arena/9d3993b8-mona-art]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "java:"; java -version 2>&1
          echo "gradle:"; gradle --version 2>&1 | head -12
          echo "sdk:"; echo "$ANDROID_HOME"; ls "$ANDROID_HOME" 2>&1
          ls "$ANDROID_HOME/platforms" 2>&1
          ls "$ANDROID_HOME/build-tools" 2>&1
