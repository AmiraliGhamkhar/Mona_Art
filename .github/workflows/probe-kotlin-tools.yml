name: probe-kotlin-tools
on:
  push:
    branches: [arena/9d3993b8-mona-art]
    paths: [".github/workflows/probe-kotlin-tools.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: resolve
        run: |
          mkdir -p tools
          {
            echo "# Resolved tool versions (generated by CI on $(date -u +%F))"
            echo "ksp_all_2_4_x:"
            curl -s --max-time 30 https://repo1.maven.org/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin/maven-metadata.xml \
              | grep -o '<version>2\.4\.[^<]*</version>' | sed 's/<[^>]*>//g' | tail -12 | sed 's/^/  - /'
            echo "ksp_latest_overall:"
            curl -s --max-time 30 https://repo1.maven.org/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin/maven-metadata.xml \
              | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -6 | sed 's/^/  - /'
            echo "kotlin_gradle_plugin_2_3_and_2_4:"
            curl -s --max-time 30 https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml \
              | grep -o '<version>2\.[34]\.[0-9]*</version>' | sed 's/<[^>]*>//g' | tail -10 | sed 's/^/  - /'
            echo "room_gradle_plugin:"
            curl -s --max-time 30 https://dl.google.com/dl/android/maven2/androidx/room/room-gradle-plugin/maven-metadata.xml \
              | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -4 | sed 's/^/  - /'
            echo "desugar_jdk_libs:"
            curl -s --max-time 30 https://dl.google.com/dl/android/maven2/com/android/tools/desugar_jdk_libs/maven-metadata.xml \
              | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -4 | sed 's/^/  - /'
            echo "androidx_test_runner:"
            curl -s --max-time 30 https://dl.google.com/dl/android/maven2/androidx/test/runner/maven-metadata.xml \
              | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -3 | sed 's/^/  - /'
            echo "documentfile:"
            curl -s --max-time 30 https://dl.google.com/dl/android/maven2/androidx/documentfile/documentfile/maven-metadata.xml \
              | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -3 | sed 's/^/  - /'
          } > tools/resolved-versions.yml
          cat tools/resolved-versions.yml
      - name: commit
        run: |
          git config user.name mona-ci
          git config user.email ci@monaart.local
          git add tools/resolved-versions.yml
          git commit -m "ci: resolved tool versions [skip ci]" || echo none
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
