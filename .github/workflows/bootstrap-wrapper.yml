name: bootstrap-wrapper
on:
  push:
    branches: [arena/9d3993b8-mona-art]
    paths: [".github/workflows/bootstrap-wrapper.yml"]
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: info
        run: |
          java -version 2>&1 | head -2
          gradle --version 2>&1 | grep -E "^Gradle|^JVM"
          echo "platforms: $(ls ${ANDROID_HOME}/platforms 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls ${ANDROID_HOME}/build-tools 2>/dev/null | tr '\n' ' ')"
          echo "cmake: $(ls ${ANDROID_HOME}/cmake 2>/dev/null | tr '\n' ' ')"
          echo "ndk: $(ls ${ANDROID_HOME}/ndk 2>/dev/null | tr '\n' ' ')"
          echo "latest gradle: $(curl -s --max-time 20 https://services.gradle.org/versions/current | head -c 200)"
      - name: generate wrapper
        run: |
          GV=$(curl -s --max-time 20 https://services.gradle.org/versions/current | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
          echo "generating wrapper for Gradle $GV"
          gradle wrapper --gradle-version "$GV" --distribution-type bin
          git status --short
      - name: commit wrapper
        run: |
          git config user.name "mona-ci"
          git config user.email "ci@monaart.local"
          git add gradle gradlew gradlew.bat
          git commit -m "build: add Gradle wrapper (generated by CI)" || echo "nothing to commit"
          git push
