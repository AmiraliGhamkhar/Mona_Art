name: bootstrap-wrapper
on:
  push:
    branches: [arena/9d3993b8-mona-art]
    paths: [".github/workflows/bootstrap-wrapper.yml"]
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate wrapper in isolation
        run: |
          set -e
          GV=$(curl -s --max-time 20 https://services.gradle.org/versions/current | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
          echo "Gradle $GV"
          mkdir -p /tmp/wrap && cd /tmp/wrap && echo "rootProject.name=\"w\"" > settings.gradle.kts
          gradle wrapper --gradle-version "$GV" --distribution-type bin -q
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cp /tmp/wrap/gradle/wrapper/gradle-wrapper.jar /tmp/wrap/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          cp /tmp/wrap/gradlew /tmp/wrap/gradlew.bat .
          chmod +x gradlew
          sed -i 's|^distributionUrl=.*|'"$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties)"'|' gradle/wrapper/gradle-wrapper.properties || true
          cat gradle/wrapper/gradle-wrapper.properties
      - name: probe ksp + plugin versions
        run: |
          probe() { curl -s --max-time 25 "$2" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -n "${3:-5}" | tr '\n' ',' ; }
          KSP=$(probe ksp https://repo1.maven.org/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin/maven-metadata.xml 400 | tr ',' '\n' | grep '^2\.4\.21-' | tail -3 | tr '\n' ',')
          echo "::notice title=KSP_FOR_KOTLIN_2_4_21::$KSP"
      - name: commit
        run: |
          git config user.name "mona-ci"
          git config user.email "ci@monaart.local"
          git add gradle gradlew gradlew.bat
          git commit -m "build: add Gradle wrapper [skip ci]" || echo "nothing to commit"
          git push
