# Detekt rule configuration.
#
# `buildUponDefaultConfig` and `allRules` are *Gradle extension* properties and
# are set in the root build.gradle.kts. They are not valid keys inside the
# config file: detekt 1.23 rejects the run outright with
# "Property 'buildUponDefaultConfig' is misspelled or does not exist."

config:
  validation: true
  warningsAsErrors: false
  # `excludes` is a comma-separated list of *regular expressions*, not glob
  # patterns (see detekt's default-detekt-config.yml). The previous value,
  # '**/build/**,**/generated/**', is not a valid Java regex ('*' is a dangling
  # meta character) and made every `detekt` task abort during config validation.
  excludes: '.*/build/.*,.*/generated/.*'

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true
